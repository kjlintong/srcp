[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "srcp"
version = "0.1.0"
description = "Shared Resource Coordination Protocol - reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.10"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
srcp = "srcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
